model:
  model_id: "meta-llama/Llama-3.2-1B"
  max_seq_length: 2048

dataset:
  dataset_id: "virattt/financial-qa-10K"
  split: "train"
  validation_size: 0.1
  test_size: 0.1

training:
  output_dir: "../outputs/adapter"
  num_train_epochs: 3
  learning_rate: 0.0001
  train_batch_size: 2
  eval_batch_size: 2
  gradient_accumulation_steps: 2

lora:
  r: 8
  alpha: 64
  dropout: 0.05

checkpoint:
  save_steps: 50
  save_total_limit: 2

evaluation:
  output_dir: "../outputs/evaluation"
  max_new_tokens: 256
  num_samples: null

wandb:
  project: "Verifi-Finance-LLM"
  run_name: "llama-3.2-1b-financial-qlora"

seed: 42